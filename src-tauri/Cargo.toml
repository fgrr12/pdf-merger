[package]
name = "grapa"
version = "1.0.0"
description = "Une varios PDFs en uno solo, sin complicaciones"
authors = ["fgrr12"]
edition = "2021"

[lib]
name = "grapa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
# Lo exige `generate_context!` en cuanto tauri.conf.json trae una seccion `plugins`.
serde_json = "1"
